[package]
name = "qnc-app"
version = "0.4.4"
edition = "2021"
description = "QNC native desktop app (egui) — Project / Ingest / Story against qnc-host"

[[bin]]
name = "qnc-app"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
qnc-media-ffmpeg = { path = "../qnc-media-ffmpeg" }
qnc-player-core = { package = "qnc-broadcast-player", path = "../qnc-broadcast-player" }
qnc-player-monitor = { path = "../qnc-player-monitor" }
qnc-player-monitor-bridge = { path = "../qnc-player-monitor-bridge" }
qnc-player-output = { path = "../qnc-player-output", features = ["audio-device"] }
qnc-player-runtime = { path = "../qnc-player-runtime" }
rodio = { version = "0.20", default-features = false, features = ["symphonia-wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
