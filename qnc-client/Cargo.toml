[package]
name = "qnc-client"
version = "0.6.0"
edition = "2021"
description = "QNC native client (F4) — proxy-first playback against qnc-host"

[[bin]]
name = "qnc-client"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
